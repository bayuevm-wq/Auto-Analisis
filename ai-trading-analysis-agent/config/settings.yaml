# AI Trading Analysis Agent Configuration
# Format Symbol: EXCHANGE:SYMBOL (e.g., BINANCE:BTCUSDT, OANDA:EURUSD)

pair: "BINANCE:BTCUSDT"
timeframe: "1h"
limit: 500
trade_style: "swing"

# TradingView Authentication (optional, leave blank for guest access)
tv_username: ""
tv_password: ""

# OKX Execution Engine configuration
okx:
  enable: false            # Set to true to enable OKX order submit
  mode: "simulated"        # 'simulated' (demo trading) or 'live'
  inst_id: "BTC-USDT-SWAP" # OKX Instrument ID (e.g. BTC-USDT or BTC-USDT-SWAP)
  trade_mode: "isolated"   # 'cash', 'cross', or 'isolated'
  mgn_mode: "isolated"     # 'cross' or 'isolated'
  leverage: 5.0            # Leverage to use (for margin/futures)
  auto_leverage: false     # Automatically calculate leverage based on SL
  order_size: 0.0          # Set order size (in contract/base currency lots). Set 0 to use order_notional
  order_notional: 10.0     # Set order size in USD/USDT value. Set 0 to use order_size
  pos_side: "auto"         # 'auto' (AI direction), 'long', or 'short'
  submit: "preferred"      # 'preferred' (only preferred side), 'both', or 'none'
  ssl_verify: true         # Set to false if experiencing local SSL/certificate errors
  base_url: "https://okx.com"
